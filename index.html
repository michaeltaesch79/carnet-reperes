<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Badass Social Worker — carnet de terrain pour travailleuse sociale : enfants suivis, comptes rendus datés, to-do et rappels. Les données restent sur l'appareil.">
<meta name="theme-color" content="#F6EDDD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#211A17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Badass SW">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* remise à zéro équivalente à celle fournie par l'hôte Claude */
html{color-scheme:light dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Badass Social Worker 2</title>
<script>(function(){try{var th=localStorage.getItem("bsw.theme");if(th==="light"||th==="dark")document.documentElement.setAttribute("data-theme",th);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400..800;1,400&display=swap">
<style>
:root{
  --ground:#F6EDDD;
  --surface:#FFFAF2;
  --surface-2:#F0E3CF;
  --ink:#2B211C;
  --ink-2:#54463F;
  --muted:#8A7A70;
  --line:#E8DAC6;
  --line-strong:#D6C3A8;
  --accent:#D45D3C;
  --accent-ink:#FFF7EC;
  --accent-soft:#F8DDD0;
  --pop:#2E8C82;
  --pop-soft:#D3EBE5;
  --rose:#E7A5A8;
  --ok:#5C8C4B;
  --warn:#D9962B;
  --warn-soft:#F9E7C3;
  --alert:#A83F63;
  --alert-soft:#F3D9E2;
  --shadow:none;
  --shadow-lift:0 12px 30px -14px rgba(43,33,28,.35);
  --r:22px;
  --r-sm:16px;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Arial Rounded MT Bold","Helvetica Neue",Arial,sans-serif;
  --mono:"Nunito","Arial Rounded MT Bold",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#211A17;
    --surface:#2B2320;
    --surface-2:#352B27;
    --ink:#F5EBDD;
    --ink-2:#D9CCBC;
    --muted:#A8978A;
    --line:#3E332E;
    --line-strong:#52443D;
    --accent:#F08A66;
    --accent-ink:#2B1A12;
    --accent-soft:#4A2C22;
    --pop:#7CC9BE;
    --pop-soft:#1F3B37;
    --rose:#D98F95;
    --ok:#9AC486;
    --warn:#F0BC5E;
    --warn-soft:#423319;
    --alert:#E58BAA;
    --alert-soft:#45202F;
    --shadow-lift:0 12px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#211A17;
  --surface:#2B2320;
  --surface-2:#352B27;
  --ink:#F5EBDD;
  --ink-2:#D9CCBC;
  --muted:#A8978A;
  --line:#3E332E;
  --line-strong:#52443D;
  --accent:#F08A66;
  --accent-ink:#2B1A12;
  --accent-soft:#4A2C22;
  --pop:#7CC9BE;
  --pop-soft:#1F3B37;
  --rose:#D98F95;
  --ok:#9AC486;
  --warn:#F0BC5E;
  --warn-soft:#423319;
  --alert:#E58BAA;
  --alert-soft:#45202F;
  --shadow-lift:0 12px 30px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2.5px solid var(--pop);outline-offset:2px;border-radius:999px}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:0;font-weight:600}
p{margin:0}
ul{margin:0;padding:0;list-style:none}

/* ---------- shell ---------- */
.app{max-width:540px;margin:0 auto;min-height:100vh;background:var(--ground);position:relative}
.top{
  position:sticky;top:0;z-index:30;
  background:var(--ground);
  background:color-mix(in srgb,var(--ground) 90%,transparent);
  backdrop-filter:blur(14px);
}
.brandbar{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
.mark{
  width:30px;height:34px;border-radius:15px 15px 6px 6px;flex:none;
  background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;
  position:relative;
}
.mark::after{
  content:"";position:absolute;right:-5px;bottom:-4px;width:12px;height:12px;border-radius:50%;
  background:var(--warn);border:2px solid var(--ground);
}
.brandbtn{display:inline-flex;align-items:center;gap:10px;padding:2px 10px 2px 2px;border-radius:999px}
.brandbtn:hover .brandname{color:var(--accent)}
.brandbtn:active .mark{transform:scale(.94)}
.brandname{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:0;color:var(--ink);
  display:inline-flex;align-items:baseline;gap:5px}
.brandname i{font-style:normal;color:var(--accent)}
.brandname .cv{font-size:10px;color:var(--muted)}
.brandbar .today{
  margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;
}
.iconbtn{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  color:var(--muted);
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:17px;height:17px;display:block}

/* ---------- rail ---------- */
.rail{display:flex;gap:14px;overflow-x:auto;padding:6px 18px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.bub{display:flex;flex-direction:column;align-items:center;gap:7px;width:66px;flex:none;scroll-snap-align:start}
.bub .ring{
  width:62px;height:62px;border-radius:50%;padding:3px;position:relative;
  background:var(--surface-2);
  transition:transform .16s ease;
}
.bub:hover .ring,.bub:focus-visible .ring{transform:translateY(-2px)}
.bub .face{
  width:100%;height:100%;border-radius:50%;
  background:var(--surface);
  display:grid;place-items:center;overflow:hidden;
  font-family:var(--display);font-weight:600;font-size:20px;
}
.bub .face img{width:100%;height:100%;object-fit:cover}
.bub .nm{
  font-size:12px;line-height:1.2;color:var(--ink-2);text-align:center;font-weight:500;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bub .flag{
  position:absolute;right:-2px;bottom:-2px;min-width:20px;height:20px;padding:0 6px;
  border-radius:999px;background:var(--alert);color:#fff;border:2.5px solid var(--ground);
  font-family:var(--mono);font-size:10px;font-weight:700;display:grid;place-items:center;
}
.bub.add .ring{background:transparent;border:2.5px dashed var(--accent);padding:1px}
.bub.add .face{color:var(--accent);background:var(--accent-soft);font-size:28px;font-weight:400;line-height:1}
.bub.add .nm{color:var(--accent);font-weight:600}
.raillegend{
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  padding:0 18px 9px;font-family:var(--mono);font-size:10px;
  color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
}
.raillegend b{font-weight:400;display:inline-flex;align-items:center;gap:4px}
.raillegend i{width:8px;height:8px;border-radius:50%;display:block}

/* ---------- tabs ---------- */
.seg{display:flex;gap:2px;margin:6px 18px 12px;padding:4px;background:var(--surface-2);border-radius:999px}
.seg button{
  flex:1;padding:8px 4px;border-radius:999px;font-size:13.5px;font-weight:600;
  color:var(--muted);
}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--ground)}
.seg .count{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:3px}

main{padding:0 18px 128px}

/* ---------- section headings ---------- */
.grouphead{
  display:flex;align-items:baseline;gap:8px;
  margin:22px 4px 10px;
  font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);
}
.grouphead .n{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted)}
.grouphead.urgent{color:var(--alert)}
.stack{display:flex;flex-direction:column;gap:9px}

/* ---------- task row ---------- */
.task{
  display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;
  background:var(--surface);border:0;border-radius:var(--r);
  padding:14px 15px;
  position:relative;overflow:hidden;
}
.task.late{box-shadow:inset 5px 0 0 var(--alert)}
.task.done{opacity:.5}
.task.done .tt{text-decoration:line-through;text-decoration-thickness:1px}
.tick{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);
  flex:none;display:grid;place-items:center;color:transparent;transition:.14s;
}
.tick:hover{border-color:var(--accent)}
.task.done .tick{background:var(--pop);border-color:var(--pop);color:#fff}
.tick svg{width:12px;height:12px}
.tt{font-size:15px;font-weight:600;line-height:1.35}
.tmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px}
.when{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.when.late{color:var(--alert);font-weight:700}
.chipkid{
  display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 2px;
  border-radius:999px;background:var(--surface-2);
  font-size:12px;font-weight:600;color:var(--ink-2);
}
.chipkid .av{
  width:18px;height:18px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  font-family:var(--display);font-size:10px;font-weight:600;flex:none;
}
.chipkid .av img{width:100%;height:100%;object-fit:cover}
.tag{
  font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);
}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.alert{background:var(--alert-soft);color:var(--alert)}
.tag.plain{background:var(--surface-2);color:var(--muted)}
.rowdel{
  position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;color:var(--muted);opacity:0;transition:.14s;
}
.task:hover .rowdel,.entry:hover .rowdel{opacity:1}
.rowdel:hover{background:var(--alert-soft);color:var(--alert)}
.rowdel svg{width:13px;height:13px}

/* ---------- entry (compte rendu) ---------- */
.entry{
  background:var(--surface);border:0;border-radius:var(--r);
  padding:15px 16px;position:relative;
}
.entryhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;padding-right:24px}
.entry .recit{font-size:14.5px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap}
.entry .obs{
  margin-top:10px;padding:11px 13px;border-radius:var(--r-sm);background:var(--pop-soft);
  font-size:13.5px;line-height:1.5;color:var(--ink-2);
}
.entry .obs b{
  display:block;font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--pop);margin-bottom:3px;
}
.presents{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;align-items:center}
.pchip{
  font-size:12px;padding:3px 10px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);
}
.pchip .who{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:4px}
.presents .lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

/* ---------- empty ---------- */
.empty{
  text-align:center;padding:40px 24px;
  border-radius:var(--r);color:var(--muted);background:var(--surface-2);
  border-radius:60px 60px var(--r) var(--r);
}
.empty h3{font-size:17px;color:var(--ink);margin-bottom:5px}
.empty p{font-size:13.5px;line-height:1.5}

/* ---------- fab ---------- */
.fab{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:8px;
  padding:14px 24px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);
  font-family:var(--display);font-weight:600;font-size:15px;
  box-shadow:var(--shadow-lift);
}
.fab svg{width:16px;height:16px}
.fab:active{transform:translateX(-50%) scale(.97)}

/* ---------- sheet / modal ---------- */
.scrim{
  position:fixed;inset:0;z-index:50;background:rgba(43,33,28,.45);
  backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;
}
.panel{
  width:100%;max-width:540px;max-height:94vh;display:flex;flex-direction:column;
  background:var(--ground);border-radius:34px 34px 0 0;
  box-shadow:var(--shadow-lift);overflow:hidden;
  animation:rise .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.panelhead{
  display:flex;align-items:center;gap:10px;padding:18px 20px 12px;
}
.panelhead::before{
  content:"";position:absolute;left:50%;top:8px;width:40px;height:5px;border-radius:999px;
  background:var(--line-strong);transform:translateX(-50%);
}
.panel{position:relative}
.panelhead h2{font-size:19px;font-weight:600}
.panelhead .close{margin-left:auto}
.panelbody{overflow-y:auto;padding:6px 18px 18px;flex:1}

/* ---------- child sheet ---------- */
.kidhead{display:flex;gap:14px;align-items:center;padding:8px 20px 16px}
.kidav{
  width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
  font-family:var(--display);font-weight:600;font-size:24px;
}
.kidav img{width:100%;height:100%;object-fit:cover}
.kidname{font-size:22px;font-weight:600;line-height:1.15}
.kidsub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
.kidtabs{display:flex;gap:2px;margin:0 18px 12px;padding:4px;background:var(--surface-2);border-radius:999px}
.kidtabs button{
  flex:1;padding:7px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);
}
.kidtabs button[aria-selected="true"]{background:var(--ink);color:var(--ground)}
.kidtabs .count{font-family:var(--mono);font-size:11px;margin-left:4px;opacity:.75}

.block{background:var(--surface);border:0;border-radius:var(--r);padding:15px 16px;margin-bottom:10px}
.blockhead{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
  font-family:var(--display);font-size:15px;font-weight:600;color:var(--ink);
}
.blockhead .add{margin-left:auto;color:var(--accent);font-family:var(--body);font-size:12.5px;font-weight:600}
.dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px;align-items:baseline}
.dl dt{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.dl dd{margin:0;color:var(--ink);font-weight:500}
.bullets li{
  display:flex;gap:9px;padding:7px 0;font-size:13.5px;line-height:1.5;color:var(--ink-2);
  border-bottom:1px solid var(--line);
}
.bullets li:last-child{border-bottom:0;padding-bottom:0}
.bullets li:first-child{padding-top:0}
.bullets .yr{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;min-width:42px;padding-top:2px;font-variant-numeric:tabular-nums}
.bullets .x{margin-left:auto;color:var(--muted);opacity:0;font-size:15px;line-height:1;padding:0 2px}
.bullets li:hover .x{opacity:.7}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.trait{
  font-size:12.5px;padding:4px 12px;border-radius:999px;
  background:var(--pop-soft);color:var(--pop);font-weight:600;
}
.trait.neg{background:var(--warn-soft);color:var(--warn)}
.freetext{font-size:13.5px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap;margin-top:9px}
.contact{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.contact:last-child{border-bottom:0}
.contact .rel{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.contact .tel{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--pop);font-variant-numeric:tabular-nums}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--line-strong)}
.tl > li{position:relative;margin-bottom:10px}
.tl > li::before{
  content:"";position:absolute;left:-19px;top:15px;width:12px;height:12px;border-radius:50%;
  background:var(--accent);border:3px solid var(--ground);
}
.tl > li.t-audience::before{background:var(--alert)}
.tl > li.t-signalement::before{background:var(--alert)}
.tl > li.t-synthese::before{background:var(--warn)}

/* ---------- forms ---------- */
.field{margin-bottom:14px}
.field > label,.flabel{
  display:block;font-family:var(--mono);font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;padding-left:4px;
}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=tel],
.field select,.field textarea{
  width:100%;padding:12px 15px;border-radius:var(--r-sm);
  background:var(--surface);border:2px solid transparent;
  font-size:15px;transition:border-color .14s;
}
.field textarea{resize:vertical;min-height:92px;line-height:1.55;border-radius:var(--r)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45;padding-left:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:400px){.two{grid-template-columns:1fr}}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{
  padding:7px 14px;border-radius:999px;
  font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface);
}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tokens{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:4px}
.token{
  display:inline-flex;align-items:center;gap:6px;padding:4px 7px 4px 12px;border-radius:999px;
  background:var(--pop-soft);color:var(--pop);font-size:12.5px;font-weight:600;
}
.token button{color:inherit;opacity:.65;font-size:14px;line-height:1;padding:0 2px}
.token button:hover{opacity:1}
.sugg{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.sugg button{
  font-size:12px;padding:5px 11px;border-radius:999px;border:1.5px dashed var(--line-strong);
  color:var(--muted);
}
.sugg button:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.btn{
  padding:12px 20px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:15px;
  background:var(--accent);color:var(--accent-ink);
}
.btn.ghost{background:var(--surface-2);color:var(--ink-2)}
.btn.danger{background:var(--alert-soft);color:var(--alert)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.formfoot{
  display:flex;gap:9px;padding:12px 18px 16px;background:var(--ground);
}
.formfoot .btn{flex:1}
.formfoot .btn.ghost{flex:0 0 auto}
.switchrow{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-sm);
  background:var(--surface);font-size:13.5px;font-weight:500;
}
.switchrow input{width:18px;height:18px;accent-color:var(--accent);flex:none}

/* ---------- search ---------- */
.searchbox{
  display:flex;align-items:center;gap:9px;padding:12px 16px;border-radius:999px;
  background:var(--surface);border:2px solid transparent;margin-top:4px;
}
.searchbox:focus-within{border-color:var(--accent)}
.searchbox input{flex:1;border:0;background:none;font-size:15px;outline:none}
.searchbox svg{width:15px;height:15px;color:var(--muted);flex:none}

.notice{
  display:flex;gap:9px;align-items:flex-start;margin:12px 0 2px;padding:12px 15px;
  border-radius:var(--r-sm);background:var(--warn-soft);
  font-size:12.5px;line-height:1.5;color:var(--ink-2);
}
.notice b{color:var(--warn);font-weight:700}
.notice button{color:var(--warn);font-weight:700;text-decoration:underline;font-size:12.5px;white-space:nowrap}
.toast{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:999px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lift);
  animation:rise .18s ease;max-width:88vw;text-align:center;
}

function applyTheme(v){
  var root=document.documentElement;
  if(v==="light"||v==="dark") root.setAttribute("data-theme",v); else root.removeAttribute("data-theme");
  try{if(v==="auto")localStorage.removeItem(THEME_KEY);else localStorage.setItem(THEME_KEY,v);}catch(e){}
  var dark=v==="dark"||(v==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute("content",dark?"#211A17":"#F6EDDD");});
}

}

function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function fmtShort(s){var d=parseD(s),m=MOIS[lang()][d.getMonth()];
  return lang()==="en"?(m+" "+d.getDate()):(d.getDate()+" "+m);}
function fmtLong(s){var d=parseD(s),m=MOISLONG[lang()][d.getMonth()];
  return lang()==="en"?(m+" "+d.getDate()+", "+d.getFullYear()):(d.getDate()+" "+m+" "+d.getFullYear());}
function dueLabel(s){
  if(!s) return t("due_none");
  var n=diffDays(today(),s);
  if(n<0) return t("due_late",Math.abs(n));
  if(n===0) return t("due_today");
  if(n===1) return t("due_tomorrow");
  if(n<7) return JOURS[lang()][parseD(s).getDay()]+" "+fmtShort(s);
  return fmtShort(s);
}
function nowHM(){var d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function firstOfMonth(s){var d=parseD(s);return iso(new Date(d.getFullYear(),d.getMonth(),1));}
function addMonths(s,n){var d=parseD(s);return iso(new Date(d.getFullYear(),d.getMonth()+n,1));}

function isRinging(x){return !x.done&&x.heure&&x.due&&(x.due<today()||(x.due===today()&&x.heure<=nowHM()));}
function age(dob){
  if(!dob) return "";
  var d=parseD(dob),n=new Date(),a=n.getFullYear()-d.getFullYear();
  if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate())) a--;
  return t("yrs",a);
}

  var d="";

    d+=(i?"L":"M")+(cx+r*Math.cos(a)).toFixed(2)+" "+(cy+r*Math.sin(a)).toFixed(2);

function avatarSVG(id){for(var i=0;i<AVATARS.length;i++) if(AVATARS[i].id===id) return AVATARS[i].f();return "";}
function avatar(c,cls){
  if(c.photo) return '<span class="'+cls+'"><img src="'+esc(c.photo)+'" alt=""></span>';
  if(c.av&&avatarSVG(c.av)) return '<span class="'+cls+' draw">'+avatarSVG(c.av)+'</span>';
  if(c.emoji) return '<span class="'+cls+' em h'+(c.hue||0)+'">'+esc(c.emoji)+'</span>';
  return '<span class="'+cls+' h'+(c.hue||0)+'">'+esc(initials(c))+'</span>';
}
function kidChip(id){
  var c=child(id); if(!c) return "";

function typeClass(k){
  if(k==="audience") return "t-audience";
  if(k==="ip") return "t-signalement";
  if(k==="synthese") return "t-synthese";
  return "";
}
function typeTag(k){
  var cls=(k==="audience"||k==="ip")?"alert":(k==="synthese"?"warn":"");
  return '<span class="tag '+cls+'">'+esc(typeLabel(k,true))+'</span>';
}
var toastT=null;
function toast(msg){
  var old=$(".toast"); if(old) old.remove();
  var n=document.createElement("div"); n.className="toast"; n.textContent=msg;
  document.body.appendChild(n);
  clearTimeout(toastT); toastT=setTimeout(function(){n.remove();},2600);
}

  var list=state.children.slice().sort(function(a,b){

function noticeHTML(){
  if(!demoKids().length) return "";

    +'<button id="wipe-demo">'+esc(t("demo_btn"))+'</button></span></div>';

function taskHTML(x){
  var late=!x.done&&x.due&&diffDays(today(),x.due)<0;
  return '<li class="task'+(x.done?" done":"")+(late?" late":"")+'">'
   +'<button class="tick" data-toggle="'+x.id+'" aria-label="'+esc(t("g_done"))+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>'
   +'<div><div class="tt">'+esc(x.t)+'</div><div class="tmeta">'
   +'<span class="when'+(late?" late":"")+'">'+esc(dueLabel(x.due))+'</span>'
   +(x.heure?'<span class="when bell'+(isRinging(x)?" ring":"")+'">'+BELL+esc(x.heure)+'</span>':'')
   +(x.urgent&&!x.done?'<span class="tag alert">'+esc(t("priority"))+'</span>':'')
   +(x.childId?kidChip(x.childId):"")
   +'</div></div>'
   +'<button class="rowdel rowedit" data-edittask="'+x.id+'" aria-label="'+esc(t("edit_task"))+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>'
   +'<button class="rowdel" data-deltask="'+x.id+'" aria-label="'+esc(t("del"))+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></li>';
}
function group(title,items,cls){
  if(!items.length) return "";
  return '<div class="grouphead'+(cls?" "+cls:"")+'">'+esc(title)+'<span class="n">'+items.length+'</span></div>'
    +'<ul class="stack">'+items.map(taskHTML).join("")+'</ul>';
}
function renderTodo(){
  var t0=today();
  var open=state.tasks.filter(function(x){return !x.done;});
  var late=open.filter(function(x){return x.due&&diffDays(t0,x.due)<0;}).sort(function(a,b){return a.due.localeCompare(b.due);});
  var now=open.filter(function(x){return x.due===t0;}).sort(function(a,b){
    if(!!a.heure!==!!b.heure) return a.heure?-1:1;
    return a.heure?a.heure.localeCompare(b.heure):0;
  });
  var soon=open.filter(function(x){var n=x.due?diffDays(t0,x.due):null;return n!==null&&n>0&&n<=7;}).sort(function(a,b){return a.due.localeCompare(b.due);});
  var later=open.filter(function(x){var n=x.due?diffDays(t0,x.due):null;return n!==null&&n>7;}).sort(function(a,b){return a.due.localeCompare(b.due);});
  var none=open.filter(function(x){return !x.due;});
  var done=state.tasks.filter(function(x){return x.done;}).slice(-6).reverse();
  var h=noticeHTML();
  var ring=open.filter(isRinging).sort(function(a,b){return (a.due+a.heure).localeCompare(b.due+b.heure);});
  if(ring.length) h+='<div class="rembanner"><div class="remhead">'+BELL+esc(t("banner_title"))+'</div>'
    +ring.map(function(x){return '<div class="remrow"><span class="rt">'+esc(x.heure)+'</span>'+esc(x.t)+'</div>';}).join("")+'</div>';
  h+='<div class="grouphead" style="margin-top:14px">'+esc(t("day_of",fmtLong(t0)))+'</div>';
  h+='<button class="btn ghost sm" id="addtask" style="width:100%;margin-bottom:4px">'+esc(t("addtask"))+'</button>';
  if(!open.length) h+='<div class="empty" style="margin-top:12px"><h3>'+esc(t("empty_todo_h"))+'</h3><p>'+esc(t("empty_todo_p"))+'</p></div>';
  h+=group(t("g_late"),late,"urgent");
  h+=group(t("g_today"),now);
  h+=group(t("g_week"),soon);
  h+=group(t("g_later"),later);
  h+=group(t("g_nodue"),none);
  h+=group(t("g_done"),done);
  $("#main").innerHTML=h;
}

function entryHTML(e){

    +'</div>'
    +'<div class="recit">'+esc(e.recit)+'</div>'
    +(e.presents&&e.presents.length?'<div class="presents"><span class="lbl">'+esc(t("present_lbl"))+'</span>'
        +e.presents.map(function(p){return '<span class="pchip">'+esc(p)+'</span>';}).join("")+'</div>':"")
    +(e.obs?'<div class="obs"><b>'+esc(t("obs"))+'</b>'+esc(e.obs)+'</div>':"")
    +(e.suite?'<div class="obs"><b>'+esc(t("next"))+'</b>'+esc(e.suite)+'</div>':"")
    +'<button class="rowdel" data-delentry="'+e.id+'" aria-label="'+esc(t("del"))+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></li>';
}
function renderCR(){
  var all=state.entries.slice().sort(function(a,b){return (b.date+(b.heure||"")).localeCompare(a.date+(a.heure||""));});
  if(!all.length){$("#main").innerHTML=noticeHTML()+'<div class="empty" style="margin-top:16px"><h3>'+esc(t("empty_cr_h"))+'</h3><p>'+esc(t("empty_cr_p"))+'</p></div>';return;}
  var h=noticeHTML(),lastMonth="";
  h+='<ul class="stack" style="margin-top:14px">';
  all.forEach(function(e){
    var d=parseD(e.date),m=MOISLONG[lang()][d.getMonth()]+" "+d.getFullYear();
    if(m!==lastMonth){h+='</ul><div class="grouphead">'+esc(m)+'</div><ul class="stack">';lastMonth=m;}
    h+=entryHTML(e);
  });
  h+='</ul>';
  $("#main").innerHTML=h;
}

var query="";
function renderSearch(){
  var q=query.trim().toLowerCase();
  var h='<div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'
    +'<input id="q" type="text" placeholder="'+esc(t("search_ph"))+'" value="'+esc(query)+'" autocomplete="off"></div>';
  if(q.length<2){
    h+='<div class="empty" style="margin-top:14px"><h3>'+esc(t("search_h"))+'</h3><p>'+esc(t("search_p"))+'</p></div>';
    $("#main").innerHTML=h; wireSearch(); return;
  }
  var kids=state.children.filter(function(c){
    return (c.prenom+" "+c.nom+" "+(c.ecole||"")+" "+(c.referent||"")+" "+(c.portrait||"")
      +" "+(c.antecedents||[]).map(function(a){return a.t;}).join(" ")
      +" "+(c.extras||[]).map(function(x){return x.l+" "+x.v;}).join(" ")).toLowerCase().indexOf(q)>=0;
  });
  var ents=state.entries.filter(function(e){
    return ((e.recit||"")+" "+(e.obs||"")+" "+(e.suite||"")+" "+(e.lieu||"")+" "+typeLabel(e.type)+" "+(e.presents||[]).join(" ")).toLowerCase().indexOf(q)>=0;
  }).sort(function(a,b){return b.date.localeCompare(a.date);});
  var tks=state.tasks.filter(function(x){return x.t.toLowerCase().indexOf(q)>=0;});
  if(!kids.length&&!ents.length&&!tks.length){
    h+='<div class="empty" style="margin-top:14px"><h3>'+esc(t("noresult_h"))+'</h3><p>'+esc(t("noresult_p",query))+'</p></div>';
  }
  if(kids.length){
    h+='<div class="grouphead">'+esc(t("r_children"))+'<span class="n">'+kids.length+'</span></div><div class="stack">';
    kids.forEach(function(c){
      h+='<button class="task" data-kid="'+c.id+'" style="text-align:left;width:100%">'+avatar(c,"kidav")
        +'<div><div class="tt">'+esc(c.prenom+" "+c.nom)+'</div><div class="tmeta"><span class="when">'+esc(age(c.dob))+'</span><span class="tag plain">'+esc(mesureLabel(c.mesure)||"—")+'</span></div></div></button>';
    });
    h+='</div>';
  }
  if(tks.length){h+='<div class="grouphead">'+esc(t("r_tasks"))+'<span class="n">'+tks.length+'</span></div><ul class="stack">'+tks.map(taskHTML).join("")+'</ul>';}
  if(ents.length){h+='<div class="grouphead">'+esc(t("r_reports"))+'<span class="n">'+ents.length+'</span></div><ul class="stack">'+ents.map(entryHTML).join("")+'</ul>';}
  $("#main").innerHTML=h;
  wireSearch();
}
function wireSearch(){
  var i=$("#q"); if(!i) return;
  i.addEventListener("input",function(){query=i.value;var p=i.selectionStart;renderSearch();var j=$("#q");if(j){j.focus();try{j.setSelectionRange(p,p);}catch(e){}}});
  if(query) i.focus();
}

var stack=[];
function topPanel(){return stack.length?stack[stack.length-1]:null;}
function topKid(){var p=topPanel();return p&&p.dataset.kidsheet?p:null;}
function repaintTopKid(){var p=topKid(); if(p) paintKid(p,p.dataset.kidsheet);}
function repaintTop(){var p=topPanel(); if(!p) return;
  if(p.dataset.kidsheet) paintKid(p,p.dataset.kidsheet);
  else if(p.dataset.calpanel) paintCal(p);}
function openPanel(o){
  var scrim=document.createElement("div"); scrim.className="scrim";
  scrim.innerHTML='<div class="panel" role="dialog" aria-modal="true">'
    +(o.rawHead||('<div class="panelhead"><h2>'+esc(o.title)+'</h2>'
      +'<button class="iconbtn close" data-close aria-label="'+esc(t("close"))+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'))
    +'<div class="panelbody">'+o.body+'</div>'
    +(o.foot?'<div class="formfoot">'+o.foot+'</div>':'')
    +'</div>';
  scrim.addEventListener("mousedown",function(e){if(e.target===scrim){e.preventDefault();closePanel();}});
  scrim.addEventListener("click",function(e){
    var b=e.target.closest?e.target.closest("[data-close]"):null;
    if(b){e.preventDefault();e.stopPropagation();closePanel();}
  },true);
  $("#layer").appendChild(scrim);
  stack.push(scrim);
  if(o.onMount) o.onMount(scrim);
  var f=scrim.querySelector("input,textarea,select"); if(f&&o.focus!==false) setTimeout(function(){f.focus();},60);
  return scrim;
}
function closePanel(){var p=stack.pop(); if(p) p.remove();}
function closeAll(){while(stack.length) closePanel();}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&stack.length) closePanel();});

function paintKid(p,id){
  var c=child(id); if(!c){closePanel();return;}
  Array.prototype.forEach.call(p.querySelectorAll("[data-kidtab]"),function(b){
    b.setAttribute("aria-selected",b.dataset.kidtab===kidTab?"true":"false");
  });
  var body=p.querySelector(".panelbody"),h="";
  if(kidTab==="profil"){
    h+='<div class="block"><div class="blockhead">'+esc(t("s_situation"))+'</div><dl class="dl">'
      +row(t("f_measure"),mesureLabel(c.mesure))+row(t("f_since"),c.depuis?fmtLong(c.depuis):"")
      +row(t("f_home"),c.lieu)+row(t("f_school"),c.ecole)
      +row(t("f_ref"),c.referent)+row(t("f_birth"),c.dob?fmtLong(c.dob)+" ("+age(c.dob)+")":"")
      +'</dl></div>';
    h+='<div class="block"><div class="blockhead">'+esc(t("s_ant"))+'<button class="add" data-addant="'+c.id+'">'+esc(t("addshort"))+'</button></div>';

        save();closePanel();render();
        var kp=topKid(); if(kp){refreshKidHead(kp);paintKid(kp,kp.dataset.kidsheet);}
        toast(existing?t("saved_profile"):t("added_kid",pr));
        if(!existing) openChild(data.id);
      });
    }});
}

function suggestPresents(){
  var seen={},out=[],hid=state.hiddenPresents||[];
  (state.presents||[]).forEach(function(p){if(!seen[p]){seen[p]=1;out.push(p);}});
  state.entries.forEach(function(e){(e.presents||[]).forEach(function(p){if(!seen[p]){seen[p]=1;out.push(p);}});});
  var def=lang()==="en"
    ? ["Their mother","Their father","Alone with the child","Colleague","Caseworker","Foster carer","Psychologist","Teacher","Team manager"]
    : ["Sa mère","Son père","Seule avec l'enfant","Collègue du service","Référent ASE","Assistante familiale","Psychologue","Enseignante","Chef de service"];
  def.forEach(function(p){if(!seen[p]){seen[p]=1;out.push(p);}});
  return out.filter(function(p){return hid.indexOf(p)<0;}).slice(0,20);
}

  p.addEventListener("click",function(e){
    var b=e.target.closest("[data-calnav],[data-day],#cal-now,#cal-add,#cal-report");
    if(!b) return;
    if(b.hasAttribute("data-calnav")){calMonth=addMonths(calMonth,+b.dataset.calnav);paintCal(p);return;}
    if(b.hasAttribute("data-day")){calSel=b.dataset.day;paintCal(p);return;}
    if(b.id==="cal-now"){calSel=today();calMonth=firstOfMonth(calSel);paintCal(p);return;}
    if(b.id==="cal-add"){taskForm("",calSel);return;}
    if(b.id==="cal-report"){
      if(!state.children.length){toast(t("add_first"));childForm();return;}
      entryForm(null,calSel);return;}
  });
  paintCal(p);
}
function paintCal(p){
  var DOW=lang()==="en"?["M","T","W","T","F","S","S"]:["L","M","M","J","V","S","D"];
  var d0=parseD(calMonth), y=d0.getFullYear(), mo=d0.getMonth();
  var offset=(d0.getDay()+6)%7, ndays=new Date(y,mo+1,0).getDate();
  var cells=Math.ceil((offset+ndays)/7)*7;
  var h='<div class="calnav">'
    +'<button class="iconbtn" data-calnav="-1" aria-label="&#8249;">&#8249;</button>'
    +'<div class="calmonth">'+esc(MOISLONG[lang()][mo]+" "+y)+'</div>'
    +'<button class="iconbtn" data-calnav="1" aria-label="&#8250;">&#8250;</button></div>';
  h+='<div class="calgrid">'+DOW.map(function(x){return '<span class="cdow">'+x+'</span>';}).join("");
  for(var i=0;i<cells;i++){
    var day=i-offset+1;
    if(day<1||day>ndays){h+='<span class="cday out"></span>';continue;}
    var ds=iso(new Date(y,mo,day));
    var tk=state.tasks.filter(function(x){return x.due===ds&&!x.done;});
    var en=state.entries.filter(function(x){return x.date===ds;});
    var hot=tk.some(function(x){return x.urgent;})||(ds<today()&&tk.length);
    var dots="";
    if(tk.length) dots+='<i class="dot'+(hot?" hot":"")+'"></i>';
    if(tk.length>1) dots+='<i class="dot'+(hot?" hot":"")+'"></i>';
    if(en.length) dots+='<i class="dot hollow"></i>';
    h+='<button class="cday'+(ds===today()?" now":"")+(ds===calSel?" sel":"")+'" data-day="'+ds+'">'
      +'<b>'+day+'</b><span class="dots">'+dots+'</span></button>';
  }
  h+='</div><div class="callegend">'+esc(t("cal_legend"))+'</div>';
  var dayTasks=state.tasks.filter(function(x){return x.due===calSel;}).sort(function(a,b){
    if(!!a.heure!==!!b.heure) return a.heure?-1:1;
    return a.heure?a.heure.localeCompare(b.heure):0;});
  var dayEnts=state.entries.filter(function(x){return x.date===calSel;});
  h+='<div class="grouphead" style="margin-top:18px">'+esc(fmtLong(calSel))+'</div>';
  if(!dayTasks.length&&!dayEnts.length) h+='<p style="font-size:13px;color:var(--muted);margin-bottom:10px">'+esc(t("cal_nothing"))+'</p>';
  if(dayTasks.length) h+='<ul class="stack">'+dayTasks.map(taskHTML).join("")+'</ul>';
  if(dayEnts.length) h+='<ul class="stack" style="margin-top:8px">'+dayEnts.map(entryHTML).join("")+'</ul>';
  h+='<button class="btn ghost sm" id="cal-report" style="width:100%;margin-top:12px">'+esc(t("cal_addreport"))+'</button>';
  p.querySelector(".panelbody").innerHTML=h;
}

function fileDownload(json,name){
  try{
    var blob=new Blob([json],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},2000);
    toast(t("bk_saved"));
  }catch(e){copyJSON(json);}
}

  if(dl) dl.save({filename:name,data:json}).then(function(){toast(t("bk_saved"));},
    function(err){if(err&&err.code==="declined")return;fileDownload(json,name);});
  else fileDownload(json,name);
}
function copyJSON(json){
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(json).then(function(){toast(t("bk_copied"));},function(){toast(t("bk_nocopy"));});
  else toast(t("bk_nocopy"));
}

function notifSupported(){try{return typeof Notification!=="undefined"&&!!Notification.requestPermission;}catch(e){return false;}}
function notifState(){try{return Notification.permission;}catch(e){return "denied";}}
function checkReminders(){
  var t0=today(),changed=false,fresh=[];
  state.tasks.forEach(function(x){
    if(x.done||!x.heure||!x.due||x.fired) return;
    if(x.due>t0||(x.due===t0&&x.heure>nowHM())) return;
    x.fired=true;changed=true;
    if(x.due===t0) fresh.push(x);
  });
  if(!changed) return;
  save();
  if(fresh.length){
    toast(t("remind_now",fresh[0].t));
    if(notifState()==="granted"){
      fresh.slice(0,3).forEach(function(x){
        try{new Notification(t("cal_title")==="Calendar"?"Reminder":"Rappel",{body:x.heure+" — "+x.t});}catch(e){}
      });
    }
  }
  if(view==="todo") render();
}
setInterval(checkReminders,30000);

     "What you do for them, they'll <em>remember</em> — even if they never say it.",
     "Take a deep breath. You are <em>right where you belong</em>.",
     "You're allowed to be tired <em>and</em> amazing at the same time.",
     "Gentleness is a strength. Yours <em>changes lives</em>.",
     "Every time you listen, you give a <em>gift</em>.",
     "Do your best today. Your best is <em>enough</em>.",
     "You're not alone. And neither are they, <em>thanks to you</em>.",
     "Nothing done with heart is ever <em>wasted</em>.",
     "The world needs people like you. <em>Exactly</em> like you."]
};
var qIdx=-1;
function showQuote(){
  var list=QUOTES[lang()],i;
  do{i=Math.floor(Math.random()*list.length);}while(i===qIdx&&list.length>1);
  qIdx=i; $("#wl-quote").innerHTML=list[i];
}
function showWelcome(){
  var u=state.user||{};
  if(!$("#wl-p1").innerHTML){
    $("#wl-p1").innerHTML=personSVG(WELCOME_PEOPLE[0],"big");
    $("#wl-p2").innerHTML=personSVG(WELCOME_PEOPLE[1],"big");
    $("#wl-p3").innerHTML=personSVG(WELCOME_PEOPLE[2],"big");
  }
  $("#wl-hello").textContent=u.name?t("wl_hello_named",u.name):t("wl_hello");
  var me=$("#wl-me");
  if(u.av&&avatarSVG(u.av)){me.innerHTML=avatarSVG(u.av);me.hidden=false;$("#wl-p2").hidden=true;}
  else{me.hidden=true;$("#wl-p2").hidden=false;}
  $("#wl-enter").textContent=t("wl_enter");
  $("#wl-other").textContent=t("wl_other");
  showQuote();
  $("#welcome").hidden=false;
}
$("#wl-enter").addEventListener("click",function(){$("#welcome").hidden=true;window.scrollTo(0,0);});
$("#wl-other").addEventListener("click",showQuote);

render();
showWelcome();
checkReminders();

if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
})();
</script>
